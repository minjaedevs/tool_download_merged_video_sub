name: Release

on:
  workflow_dispatch:
    inputs:
      nightly:
        description: 'nightly build (git sha version)'
        type: boolean
        default: false
      version:
        description: 'version tag for production release (e.g. 0.9.1)'
        type: string
        default: ''

permissions:
  contents: write

env:
  QT_QPA_PLATFORM: offscreen
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: build-windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -U "https://github.com/yt-dlp/Pyinstaller-Builds/releases/download/2025.09.13.221251/pyinstaller-6.16.0-py3-none-win_amd64.whl"

      - name: Validate bundled assets
        working-directory: ./app
        shell: pwsh
        run: |
          $required = @(
            "assets/mp42hls.exe",
            "assets/yt-dlp-gui.ico",
            "root/config.toml"
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              Write-Error "Missing required release asset: $path"
              exit 1
            }
          }

      - name: Determine version
        id: version
        shell: bash
        run: |
          short_sha=$(git rev-parse --short HEAD)

          if [[ "${{ github.event.inputs.nightly }}" == 'true' ]]; then
            version="nightly-$short_sha"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            version="${{ github.event.inputs.version }}"
          else
            echo "::error::Production release requires a version tag. Set the 'version' input."
            exit 1
          fi

          echo "Version: $version"
          echo "short_sha=$short_sha" >> $GITHUB_OUTPUT
          echo "version=$version"       >> $GITHUB_OUTPUT

      - name: Patch version strings
        working-directory: ./app
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"

          # Update __version__ in _version.py (used by updater and imported by app.py)
          sed -i "s/^__version__ = .*/__version__ = \"${version}\"/" ./_version.py

          echo "Patched _version.py -> __version__ = \"${version}\""

      - name: Build application
        working-directory: ./app
        shell: bash
        run: |
          pyinstaller tool-download-movie.spec --clean --noconfirm

      - name: Package for distribution
        working-directory: ./app
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $packageDir = "tool-download-movie-pro-v$version"

          if (Test-Path $packageDir) {
            Remove-Item $packageDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force "$packageDir/assets" | Out-Null

          Copy-Item dist/tool-download-movie.exe "$packageDir/tool-download-movie.exe"
          Copy-Item assets/mp42hls.exe "$packageDir/assets/mp42hls.exe"
          Copy-Item assets/yt-dlp-gui.ico "$packageDir/assets/yt-dlp-gui.ico"
          if (Test-Path fonts) {
            Copy-Item fonts "$packageDir/fonts" -Recurse
          }
          if (Test-Path ffmpeg.exe) {
            Copy-Item ffmpeg.exe "$packageDir/ffmpeg.exe"
          } else {
            Write-Host "ffmpeg.exe not found in app/. Full zip will omit it; updater exe is unaffected."
          }
          if (Test-Path ffprobe.exe) {
            Copy-Item ffprobe.exe "$packageDir/ffprobe.exe"
          } else {
            Write-Host "ffprobe.exe not found in app/. Full zip will omit it; updater exe is unaffected."
          }

          @"
          Tool Download Movie v$version

          Run: tool-download-movie.exe

          Included:
          - tool-download-movie.exe
          - assets/
          - ffmpeg.exe if present in this package
          - ffprobe.exe if present in this package
          - fonts/
          - README_DISTRIBUTION.txt

          Note:
          - mp42hls.exe is also bundled inside the one-file exe by PyInstaller.
          - For future updates, users only need to replace tool-download-movie.exe.
          - Local user settings are stored under the Windows app data folder,
            for example: %LOCALAPPDATA%\Tool Download Movie
          "@ | Set-Content -Path "$packageDir/README_DISTRIBUTION.txt" -Encoding UTF8

          Compress-Archive -Path "$packageDir/*" -DestinationPath ./tool-download-movie-win64.zip -Force

          # Create a directory for release assets
          New-Item -ItemType Directory -Force release-assets | Out-Null
          # Copy the standalone .exe so it can be uploaded as a release asset
          Copy-Item dist/tool-download-movie.exe release-assets/

          Write-Host "=== dist/ contents ==="
          Get-ChildItem dist/

      - name: Upload nightly release
        if: ${{ github.event.inputs.nightly == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          body: |
            Version ${{ steps.version.outputs.version }} – `[${{ steps.version.outputs.short_sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})`
          generate_release_notes: false
          draft: false
          prerelease: true
          files: |
            app/tool-download-movie-win64.zip
            app/release-assets/tool-download-movie.exe
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload production release
        if: ${{ github.event.inputs.nightly != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            app/tool-download-movie-win64.zip
            app/release-assets/tool-download-movie.exe
        env:
          GH_TOKEN: ${{ github.token }}
